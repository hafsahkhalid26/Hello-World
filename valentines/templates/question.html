<!DOCTYPE html>
<html>
<head>
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            text-align: center;
            font-family: 'Arial', sans-serif;
            background-color: #fff0f5; /* light lavender background */
        }

        nav button, .home-button {
            background-color: #dd892fff;
            color: black;
            font-size: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        nav button:hover, .home-button:hover {
            background-color: #5e4e18ff; /* darker on hover */
        }

        -----------------
        nav button, .choice-button {
            background-color: #99355eff;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        nav button:hover, .choice-button:hover {
            background-color: #d56191ff; /* darker pink on hover */
        }

        h1 {
            color: #a91e1eff;
            font-family: 'Comic Sans MS', sans-serif;
        }

        p {
            color: #210721ff;
            font-size: 18px;
        }

        img {
            margin-top: 15px;
            border-radius: 10px;
            max-width: 300px;
        }

         /* Sparkling heart animation */
        .sparkle-heart {
            display: inline-block;
            animation: sparkle 1s infinite alternate;
            font-size: 1em; /* bigger heart */
        }

        @keyframes sparkle {
            0% { transform: scale(1) rotate(0deg); opacity: 0.8; }
            50% { transform: scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(-10deg); opacity: 0.8; }
        }


    </style>
</head>

<body>

    <!-- Navigation bar -->
    <nav>
        <a href="/"><button class="home-button">Home</button></a>
    </nav>

    <h1>
        Will you be my Valentine? 
        <span class="sparkle-heart">💖</span>
    </h1>

    <!-- Yes / No buttons -->
    <form method="POST">
        <button type="submit" name="valentine" value="yes" class="choice-button">Yes</button>
        <button type="submit" name="valentine" value="no" class="choice-button">No</button>
    </form>

    <!-- Display image/message depending on choice -->
    {% if choice == "yes" %}
        <p>Haha...Just kidding!</p>
        <img src="{{ url_for('static', filename='yes.gif') }}" alt="Yes image">
    {% elif choice == "no" %}
        <p>Wow...you're so mean</p>
        <img src="{{ url_for('static', filename='no.gif') }}" alt="No image">
    {% endif %}


</body>
</html>
